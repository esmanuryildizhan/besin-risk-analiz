<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <meta
      name="description"
      content="Besin Risk Analiz - Kişisel alerjen ve kalori takip uygulaması"
    />
    <!-- SİMGELER
         Önceden hiç tanımlı değildi; tarayıcı varsayılan olarak /favicon.ico
         dosyasına düşüyor ve orada Create React App'in kendi React logosu
         duruyordu. Artık uygulamanın kendi simgesi. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <!-- SVG sürüm: destekleyen tarayıcılar bunu tercih eder ve her boyutta
         keskin kalır; .ico eski tarayıcılar için yedek. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Besin Risk Analiz</title>
    <script>
      /* Tema, React yuklenmeden ONCE uygulanir. Bu betik kaldirilirsa karanlik
         mod kullanicisi her acilista bir an beyaz ekran gorur (FOUC). Mantik
         src/tema.js ile ayni; orada degisiklik yapilirsa burasi da guncellenmeli. */
      (function () {
        try {
          var t = localStorage.getItem('tema');
          var karanlik = t === 'karanlik'
            || ((t === 'sistem' || t === null)
                && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (karanlik) document.documentElement.classList.add('dark');
        } catch (e) { /* depolama kapali: acik mod ile devam */ }
      })();
    </script>
  </head>
  <body>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript'i etkinleştirmelisiniz.</noscript>
    <div id="root"></div>
  </body>
</html>
