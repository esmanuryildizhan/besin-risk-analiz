<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <meta
      name="description"
      content="Besin Risk Analiz Sistemi - hastalık, alerji ve kan tahlili sonuçlarına göre besin risk değerlendirmesi"
    />
    <!-- SİMGELER
         Önceden hiç tanımlı değildi; tarayıcı varsayılan olarak /favicon.ico
         dosyasına düşüyor ve orada Create React App'in kendi React logosu
         duruyordu. Artık uygulamanın kendi simgesi. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <!-- SVG sürüm: destekleyen tarayıcılar bunu tercih eder ve her boyutta
         keskin kalır; .ico eski tarayıcılar için yedek. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Besin Risk Analiz Sistemi</title>
    <!-- BAĞLANTI ÖNİZLEMESİ (Open Graph)
         Bağlantı bir sohbette paylaşıldığında uygulamalar bu etiketleri okuyup
         başlık, açıklama ve görselle bir kart gösteriyor. Etiketler yokken
         çıplak adres görünüyordu; çıplak adres hem güven vermiyor hem de bazı
         uygulamalar onu bağlantıya çevirmiyor. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Besin Risk Analiz Sistemi" />
    <meta property="og:title" content="Besin Risk Analiz Sistemi" />
    <meta property="og:description" content="Hastalık, alerji ve kan tahlili sonuçlarına göre kişiselleştirilmiş besin risk değerlendirmesi." />
    <meta property="og:image" content="%REACT_APP_SITE_URL%/logo512.png" />
    <meta property="og:url" content="%REACT_APP_SITE_URL%/" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />
    <!-- Temayı boyamadan önce uygular (FOUC engeli).
         Satır içi değil ayrı dosya: satır içi betik katı CSP ile çalışmıyor. -->
    <script src="%PUBLIC_URL%/tema-onyukleme.js"></script>
  </head>
  <body>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript'i etkinleştirmelisiniz.</noscript>
    <div id="root"></div>
  </body>
</html>
